# =============================================================================
# HuggingFace Token Secret
# =============================================================================
#
# This Kubernetes Secret stores your HuggingFace access token, which is
# needed to download gated models like Llama 3.2.
#
# Setup:
#   1. Go to https://huggingface.co/meta-llama/Llama-3.2-3B-Instruct
#   2. Click "Agree and access repository" to accept Meta's license
#      (approval is usually instant)
#   3. Go to https://huggingface.co/settings/tokens
#   4. Create a new token with "Read" permission
#   5. Replace YOUR_HF_TOKEN below with that token
#
# Alternatively, you can skip editing this file and set the HF_TOKEN
# environment variable before running deploy.sh — the deploy script will
# automatically patch this file with the value.
#
# Security note:
#   This file contains a secret value. Do NOT commit it to version control
#   with a real token. The .gitignore should exclude this, or use the
#   deploy.sh approach with environment variables instead.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
  namespace: kserve
type: Opaque
stringData:
  HF_TOKEN: "YOUR_HF_TOKEN"
