{{- /*
  HuggingFace Token Secret
  Stores the token used by vLLM to download gated models from HuggingFace Hub.
  Referenced by the InferenceService via secretKeyRef.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: hf-secret
  namespace: {{ .Values.kserveNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: openclaw-kserve
type: Opaque
stringData:
  HF_TOKEN: {{ .Values.hfToken | quote }}
