{{- /*
  OpenClaw Gateway Token Secret
  Used to authenticate device pairing requests in the OpenClaw web UI.
  Injected into the OpenClaw container via envFrom in the Helm values.
*/ -}}
apiVersion: v1
kind: Secret
metadata:
  name: openclaw-env-secret
  namespace: {{ .Values.openclawNamespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: openclaw-kserve
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: {{ .Values.gatewayToken | quote }}
