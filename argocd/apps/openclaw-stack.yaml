# =============================================================================
# ArgoCD Application — OpenClaw + Llama Model (our custom Helm chart)
# =============================================================================
#
# Deploys the custom helm-chart/ from this repository, which includes:
#   - HuggingFace token secret
#   - KServe InferenceService (Llama 3.2 3B)
#   - OpenClaw namespace and gateway token secret
#
# Sync wave 0 (default) — installs last, after all infrastructure is ready.
#
# IMPORTANT: Update repoURL to point to YOUR Git repository.
#
# Secrets handling:
#   The hfToken and gatewayToken values contain secrets. There are several
#   approaches to handle this in GitOps:
#
#   Option A: Use ArgoCD + Sealed Secrets or External Secrets Operator
#     - Store encrypted secrets in Git (Sealed Secrets) or reference
#       an external store like GCP Secret Manager (External Secrets)
#
#   Option B: Use ArgoCD Vault Plugin
#     - Reference secrets from HashiCorp Vault in your manifests
#
#   Option C: Set values via ArgoCD UI/CLI (not in Git)
#     - argocd app set openclaw-model --helm-set hfToken=hf_xxx
#     - Secrets never touch Git, but lose full GitOps reproducibility
#
#   This example uses Option C (values passed at sync time).
# =============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw-model
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # UPDATE THIS to your Git repository URL
    repoURL: https://github.com/YOUR_USERNAME/Openclaw-Kserve.git
    targetRevision: main
    path: helm-chart
    helm:
      # These are placeholder values. Set real values via:
      #   argocd app set openclaw-model \
      #     --helm-set hfToken=hf_xxx \
      #     --helm-set gatewayToken=my-secret
      values: |
        hfToken: ""
        gatewayToken: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: kserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
