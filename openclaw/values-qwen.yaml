# =============================================================================
# OpenClaw Helm Values — Configured for KServe-hosted Qwen 3.5 2B
# =============================================================================
#
# Use this instead of values.yaml when deploying with Qwen 3.5 2B
# (kserve/qwen-inferenceservice.yaml) instead of Llama 3.2 3B.
#
# The only differences from values.yaml:
#   - baseUrl points to qwen-3-5-2b-predictor (not llama-3-2b-predictor)
#   - model id is Qwen/Qwen3.5-2B (not meta-llama/Llama-3.2-3B-Instruct)
# =============================================================================
app-template:
  controllers:
    main:
      containers:
        main:
          envFrom:
            - secretRef:
                name: openclaw-env-secret

  configMaps:
    config:
      enabled: true
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "controlUi": {
                "dangerouslyAllowHostHeaderOriginFallback": true
              }
            },
            "models": {
              "mode": "merge",
              "providers": {
                "kserve-vllm": {
                  "baseUrl": "http://qwen-3-5-2b-predictor.kserve.svc.cluster.local/v1",
                  "api": "openai-completions",
                  "apiKey": "dummy",
                  "models": [
                    {
                      "id": "Qwen/Qwen3.5-2B",
                      "name": "Qwen 3.5 2B (KServe)",
                      "reasoning": false,
                      "input": ["text"],
                      "contextWindow": 8192,
                      "maxTokens": 4096
                    }
                  ]
                }
              }
            },
            "agents": {
              "defaults": {
                "model": {
                  "primary": "kserve-vllm/Qwen/Qwen3.5-2B"
                }
              }
            }
          }

  persistence:
    data:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
