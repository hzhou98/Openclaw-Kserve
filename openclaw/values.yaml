# =============================================================================
# OpenClaw Helm Values — Configured for KServe-hosted Llama 3.2 3B
# =============================================================================
#
# This file overrides the default OpenClaw Helm chart values to point the
# application at our self-hosted Llama 3.2 3B model via KServe + vLLM.
#
# The chart uses bjw-s/app-template as its base, so all values are nested
# under app-template. Model configuration lives in openclaw.json (via the
# configMaps.config section), not environment variables.
#
# vLLM implements the OpenAI API spec (POST /v1/chat/completions), so we
# register it as a custom provider with api: "openai-completions".
# =============================================================================
app-template:
  controllers:
    main:
      containers:
        main:
          # envFrom injects all key-value pairs from the referenced secret
          # as environment variables. The openclaw-env-secret contains
          # OPENCLAW_GATEWAY_TOKEN which is referenced via ${ENV_VAR}
          # substitution in openclaw.json's gateway.auth.token field.
          envFrom:
            - secretRef:
                name: openclaw-env-secret

  # ---------------------------------------------------------------------------
  # OpenClaw configuration (openclaw.json)
  # ---------------------------------------------------------------------------
  # The configMaps.config.data."openclaw.json" field is the primary config
  # file for OpenClaw. The init-config container copies (or merges) it into
  # /home/node/.openclaw/openclaw.json on startup.
  #
  # We override the default config to:
  #   1. Add a "kserve-vllm" custom provider pointing at our in-cluster
  #      vLLM endpoint (KServe InferenceService).
  #   2. Set the default agent model to use that provider.
  #
  # Model provider config:
  #   - baseUrl: KServe creates a Service named <isvc-name>-predictor in the
  #     namespace where the InferenceService is deployed. Our InferenceService
  #     is "llama-3-2b" in namespace "kserve", so the Service is
  #     "llama-3-2b-predictor.kserve.svc.cluster.local". The /v1 suffix is
  #     required — vLLM serves at /v1/chat/completions, /v1/models, etc.
  #   - api: "openai-completions" tells OpenClaw to use the OpenAI completions
  #     protocol when talking to this provider.
  #   - apiKey: vLLM doesn't validate API keys by default, but OpenClaw
  #     requires a non-empty value. "dummy" satisfies this.
  #   - models[].id: Must exactly match what vLLM reports via GET /v1/models
  #     (the HuggingFace repo ID by default).
  # ---------------------------------------------------------------------------
  configMaps:
    config:
      enabled: true
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "dangerouslyAllowHostHeaderOriginFallback": true
              }
            },
            "models": {
              "mode": "merge",
              "providers": {
                "kserve-vllm": {
                  "baseUrl": "http://llama-3-2b-predictor.kserve.svc.cluster.local/v1",
                  "api": "openai-completions",
                  "apiKey": "dummy",
                  "models": [
                    {
                      "id": "meta-llama/Llama-3.2-3B-Instruct",
                      "name": "Llama 3.2 3B (KServe)",
                      "reasoning": false,
                      "input": ["text"],
                      "contextWindow": 8192,
                      "maxTokens": 4096
                    }
                  ]
                }
              }
            },
            "agents": {
              "defaults": {
                "model": {
                  "primary": "kserve-vllm/meta-llama/Llama-3.2-3B-Instruct"
                }
              }
            }
          }

  # Persistent volume for OpenClaw's data (conversation history, device
  # pairings, configuration). Uses the cluster's default StorageClass
  # (GKE creates pd-standard by default). ReadWriteOnce means only one
  # node can mount it at a time (fine since we run a single replica).
  persistence:
    data:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
