# =============================================================================
# OpenClaw Helm Values — OpenAI API only (no local GPU model)
# =============================================================================
#
# Use this instead of values.yaml when you don't have a GPU node or the
# KServe InferenceService isn't ready. This connects OpenClaw directly to
# OpenAI's API — no KServe, no vLLM, no GPU required.
#
# Prerequisites:
#   - Set OPENAI_API_KEY before running install-openclaw.sh:
#       export OPENAI_API_KEY=sk-...
#       bash openclaw/install-openclaw.sh --values values-openai.yaml
#
# To add skills, compose with values-skills.yaml:
#   bash openclaw/install-openclaw.sh --values values-openai.yaml --values values-skills.yaml
#
# The default model is gpt-4o-mini (cheapest). Use --api-model to select
# a different model, or change agents.defaults.model.primary manually.
# =============================================================================
app-template:
  controllers:
    main:
      containers:
        main:
          envFrom:
            - secretRef:
                name: openclaw-env-secret

  configMaps:
    config:
      enabled: true
      data:
        openclaw.json: |
          {
            "gateway": {
              "port": 18789,
              "mode": "local",
              "auth": {
                "mode": "token",
                "token": "${OPENCLAW_GATEWAY_TOKEN}"
              },
              "controlUi": {
                "dangerouslyAllowHostHeaderOriginFallback": true
              }
            },
            "models": {
              "mode": "merge",
              "providers": {
                "openai": {
                  "baseUrl": "https://api.openai.com/v1",
                  "api": "openai-responses",
                  "apiKey": "${OPENAI_API_KEY}",
                  "models": [
                    {
                      "id": "gpt-4.1",
                      "name": "GPT-4.1",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "contextWindow": 1047576,
                      "maxTokens": 32768
                    },
                    {
                      "id": "gpt-4.1-mini",
                      "name": "GPT-4.1 Mini",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "contextWindow": 1047576,
                      "maxTokens": 32768
                    },
                    {
                      "id": "gpt-4.1-nano",
                      "name": "GPT-4.1 Nano",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "contextWindow": 1047576,
                      "maxTokens": 32768
                    },
                    {
                      "id": "gpt-4o",
                      "name": "GPT-4o",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "contextWindow": 128000,
                      "maxTokens": 16384
                    },
                    {
                      "id": "gpt-4o-mini",
                      "name": "GPT-4o Mini",
                      "reasoning": false,
                      "input": ["text", "image"],
                      "contextWindow": 128000,
                      "maxTokens": 16384
                    },
                    {
                      "id": "o3",
                      "name": "o3",
                      "reasoning": true,
                      "input": ["text", "image"],
                      "contextWindow": 200000,
                      "maxTokens": 100000
                    },
                    {
                      "id": "o3-mini",
                      "name": "o3 Mini",
                      "reasoning": true,
                      "input": ["text"],
                      "contextWindow": 200000,
                      "maxTokens": 100000
                    },
                    {
                      "id": "o4-mini",
                      "name": "o4 Mini",
                      "reasoning": true,
                      "input": ["text", "image"],
                      "contextWindow": 200000,
                      "maxTokens": 100000
                    }
                  ]
                }
              }
            },
            "agents": {
              "defaults": {
                "model": {
                  "primary": "openai/gpt-4o-mini"
                }
              }
            }
          }

  persistence:
    data:
      enabled: true
      size: 5Gi
      accessMode: ReadWriteOnce
